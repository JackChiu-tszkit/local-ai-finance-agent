# Do not send Streamlit usage stats from this local finance app.
[browser]
gatherUsageStats = false

[server]
fileWatcherType = "auto"

[theme]
base = "light"
primaryColor = "#1f6b3a"
backgroundColor = "#f8f8f8"
secondaryBackgroundColor = "#eeeeee"
textColor = "#0a0a0a"
font = "sans serif"
baseRadius = "none"
buttonRadius = "none"

[theme.sidebar]
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#171717"
textColor = "#f8f8f8"
primaryColor = "#1f6b3a"
